<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
        h2 { margin-top: 40px; }
        .login-container { display: flex; justify-content: center; gap: 40px; margin-top: 40px; }
        .login-box { width: 280px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.2); background: white; }
        .login-header { padding: 15px; color: white; font-size: 18px; font-weight: bold; }
        .employee-header { background: linear-gradient(135deg, #8e2de2, #6a0dad); }
        .admin-header { background: linear-gradient(135deg, #ff8c00, #ff6600); }
        .login-body { padding: 20px; text-align: left; }
        .login-body label { display: block; margin-top: 10px; font-weight: bold; }
        .login-body input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .login-btn { margin-top: 15px; padding: 8px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .employee-btn { background: #6a0dad; }
        .admin-btn { background: #ff6600; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
    <h2>Employee Onboarding System - Login</h2>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header employee-header">Employee Login</div>
            <div class="login-body">
                <form action="LoginServlet" method="post">
                    <input type="hidden" name="expectedRole" value="EMPLOYEE">
                    <label>Email:</label>
                    <input type="text" name="email" required>
                    <label>Password:</label>
                    <input type="password" name="password" required>
                    <br>
                    <button class="login-btn employee-btn" type="submit">LOGIN</button>
                </form>
            </div>
        </div>
        <div class="login-box">
            <div class="login-header admin-header">Admin / HR Login</div>
            <div class="login-body">
                <form action="LoginServlet" method="post">
                    <input type="hidden" name="expectedRole" value="ADMIN">
                    <label>Email:</label>
                    <input type="text" name="email" required>
                    <label>Password:</label>
                    <input type="password" name="password" required>
                    <br>
                    <button class="login-btn admin-btn" type="submit">LOGIN</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
