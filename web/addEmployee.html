<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Add New Employee</h2>
    <form action="AddEmployeeServlet" method="post" style="max-width:500px;">

        <h3>Login Details</h3>
        <label>Name:</label>
        <input type="text" name="name" required>
        <label>Login Email:</label>
        <input type="email" name="email" required>
        <label>Password:</label>
        <input type="password" name="password" id="password" required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$"
            oninvalid="this.setCustomValidity('Password must be at least 8 characters, with uppercase, lowercase, a number, and a special character (@$!%*?&#)')"
            oninput="this.setCustomValidity('')">
        <small style="color:#666; font-size:12px;">Min 8 chars, uppercase, lowercase, number, special character</small>

        <h3>Personal & Employment Details</h3>
        <label>Employee Code:</label>
        <input type="text" name="employeeCode" placeholder="e.g. EMP1001" required>
        <label>Date of Birth:</label>
        <input type="date" name="dob" required>
        <label>Phone:</label>
        <input type="text" name="phone" required>
        <label>Personal Email:</label>
        <input type="email" name="personalEmail" required>
        <label>Emergency Contact:</label>
        <input type="text" name="emergencyContact" placeholder="Name and phone number" required>
        <label>Current Address:</label>
        <input type="text" name="currentAddress" required>
        <label>Permanent Address:</label>
        <input type="text" name="permanentAddress" required>
        <label>Department:</label>
        <input type="text" name="department" required>
        <label>Designation:</label>
        <input type="text" name="designation" required>
        <label>Employment Type:</label>
        <select name="employmentType" required>
            <option value="Full-Time">Full-Time</option>
            <option value="Contract">Contract</option>
            <option value="Intern">Intern</option>
        </select>
        <label>Work Location:</label>
        <select name="workLocation" required>
            <option value="Office">Office</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
        </select>

        <h3>Compensation</h3>
        <label>Starting Salary (CTC):</label>
        <input type="number" step="0.01" name="firstSalary" required>
        <label>PF/ESI Contribution Amount:</label>
        <input type="number" step="0.01" name="pfEsiAmount" required>

        <br><br>
        <button type="submit">Add Employee</button>
    </form>
    <br><a href="EmployeeListServlet">Back to Employee List</a>
</body>
</html>
